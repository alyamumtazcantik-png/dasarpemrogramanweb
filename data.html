<div class="sidebar">

<div class="logo">
FoodieOrder

<div class="sidebar-menu">

<a href="index.html"> Dashboard</a>

<div class="main-content">

<h2 class="text-center section-title mb-4">

Data Pesanan

</h2>

<marquee class="bg-danger text-white p-2 rounded mb-4">

Jumlah Antrian Diproses :
<span id="jumlahAntrian">0</span>

</marquee>

<div class="card p-4 shadow">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-danger">

<tr>

<th>Nama</th>
<th>Menu</th>
<th>Jumlah</th>
<th>Status</th>
<th>Countdown</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

let dataPesanan =
JSON.parse(localStorage.getItem("pesanan")) || [];

function tampilData(){

    let isi = "";

    let antrian = 0;

    dataPesanan.forEach((item)=>{

        if(item.status == "Diproses"){
            antrian++;
        }

        let menit =
        Math.floor(item.waktu / 60);

        let detik =
        item.waktu % 60;

        isi += `
        <tr>

        <td>${item.nama}</td>

        <td>${item.menu}</td>

        <td>${item.jumlah}</td>

        <td>

        ${
            item.status == "Diproses"
            ?
            '<span class="badge bg-warning">Diproses</span>'
            :
            '<span class="badge bg-success">Selesai</span>'
        }

        </td>

        <td>

        ${
        item.waktu > 0
        ?
        `${menit}:${detik < 10 ? "0"+detik : detik}`
        :
        'Selesai'
        }

        </td>

        </tr>
        `;
    });

    $("#tbody").html(isi);

    $("#jumlahAntrian").text(antrian);

    localStorage.setItem(
    "pesanan",
    JSON.stringify(dataPesanan)
    );

}

setInterval(function(){

    dataPesanan.forEach((item)=>{

        if(item.waktu > 0){

            item.waktu--;

        }
        else{

            item.status = "Selesai";

        }

    });

    tampilData();

},1000);

tampilData();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
