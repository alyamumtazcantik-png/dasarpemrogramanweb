<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieOrder</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
    margin:0;
    font-family:Arial;
    background:#fff5f7;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#ff4d6d;
    position:fixed;
    left:0;
    top:0;
    padding-top:20px;
    z-index:999;
}

.logo{
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.sidebar-menu{
    padding:0 15px;
}

.sidebar-menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px;
    margin-bottom:12px;
    border-radius:10px;
    transition:0.3s;
    background:#ff6b81;
    font-weight:bold;
}

.sidebar-menu a:hover{
    background:#ff8fa3;
    transform:translateX(5px);
}

.hero-section{
    margin-left:250px;
    padding:120px 40px;
    background:linear-gradient(135deg,#ff4d6d,#ff8fa3,#ffb3c1);
    color:white;
    border-radius:0 0 40px 40px;
}

.hero-title{
    font-size:65px;
    font-weight:bold;
}

.foodie{ color:#fff; }
.text-order{ color:#ffe66d; }

.hero-text{
    font-size:20px;
    margin-top:10px;
}

.running-text{
    background:rgba(255,255,255,0.2);
    padding:12px;
    border-radius:12px;
    margin-top:15px;
    font-weight:bold;
}

.hero-btn button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

.btn-menu{
    background:white;
    color:#ff4d6d;
}

.btn-menu:hover{
    transform:scale(1.05);
}

.footer{
    background:#ff4d6d;
    color:white;
    text-align:center;
    padding:20px;
    margin-left:250px;
}

@media(max-width:768px){

    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }

    .hero-section{
        margin-left:0;
        padding:60px 20px;
        text-align:center;
    }

    .hero-title{
        font-size:40px;
    }

    .footer{
        margin-left:0;
    }
}

</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">FoodieOrder</div>

    <div class="sidebar-menu">
        <a href="index.html"> Dashboard</a>
        <a href="menu.html"> Menu</a>
        <a href="order.html"> Order</a>
        <a href="data.html"> Data</a>
        <a href="about.html">About</a>
    </div>
</div>

<section class="hero-section">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-lg-6">
                <h1 class="hero-title">
                    <span class="foodie">Foodie</span>
                    <span class="text-order">Order</span>
                </h1>

                <p class="hero-text">
                    Aplikasi pemesanan makanan modern, cepat, dan responsive 
                </p>

                <div class="running-text">
                     Promo Hari Ini Diskon 20% 
                </div>

            </div>

            <div class="col-lg-6 text-center">
                <img src="foodieorder.png" class="img-fluid" style="border-radius:20px;">
            </div>

        </div>
    </div>
</section>

<footer class="footer">
    <h5>FoodieOrder © 2026</h5>
    <p>Responsive Food Ordering Website</p>
</footer>

</body>
</html>
