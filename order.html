<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#fff5f7;
font-family:Arial;
transition:0.3s;
}

.section-title{
color:#ff4d4d;
font-weight:bold;
}

.btn-order{
background:#ff4d6d;
color:white;
border:none;
padding:12px;
font-weight:bold;
border-radius:10px;
}

.btn-order:hover{
background:#e63956;
color:white;
}

.card{
border:none;
border-radius:20px;
}

table{
background:white;
border-radius:20px;
overflow:hidden;
}

</style>

</head>

<body>

<div class="container py-5">

<!-- DARK MODE -->
<button id="darkMode"
class="btn btn-dark mb-3">

Dark Mode

</button>

<h2 class="text-center section-title mb-4">
Form Pemesanan
</h2>

<marquee class="bg-danger text-white p-2 rounded mb-4">

Jumlah Antrian Diproses :
<span id="jumlahAntrian">0</span>

</marquee>

<div class="card p-4 shadow">

<div class="mb-3">

<label>Nama</label>

<input type="text"
id="nama"
class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
id="email"
class="form-control">

</div>

<div class="mb-3">

<label>No HP</label>

<input type="text"
id="nohp"
class="form-control">

</div>

<div class="mb-3">

<label>Tanggal Pesan</label>

<input type="date"
id="tanggal"
class="form-control">

</div>

<div class="mb-3">

<label>Menu</label>

<select id="menuMakananSelect"
class="form-select">

<option value="">
Pilih Menu
</option>

<option value="Sushi">
Sushi
</option>

<option value="Ramen">
Ramen
</option>

<option value="Kebab">
Kebab
</option>

</select>

</div>

<div class="mb-3">

<label>Jumlah</label>

<input type="number"
id="jumlah"
class="form-control">

</div>

<div class="mb-3">

<label>Jenis Pembayaran</label>

<div>

<input type="radio"
name="bayar"
value="Cash">

Cash

<input type="radio"
name="bayar"
value="QRIS">

QRIS

</div>

</div>

<div class="mb-3">

<label>Topping</label>

<div>

<input type="checkbox"
class="topping"
value="Pedas">

Pedas

<input type="checkbox"
class="topping"
value="Keju">

Keju

</div>

</div>

<div class="mb-3">

<label>Catatan</label>

<textarea id="catatan"
class="form-control"></textarea>

</div>

<div class="mb-3">

<label>Total Harga</label>

<input type="text"
id="total"
class="form-control"
readonly>

</div>

<button type="button"
id="btnPesan"
class="btn btn-order">

Pesan Sekarang

</button>

<button onclick="hapusData()"
class="btn btn-dark mt-3">

Hapus Semua Data

</button>

</div>

<!-- SEARCH -->
<div class="mt-4">

<input type="text"
id="search"
class="form-control"
placeholder="Cari Nama Pesanan...">

</div>

<!-- TABLE -->
<div class="table-responsive mt-5">

<table class="table table-bordered table-hover">

<thead class="table-danger">

<tr>

<th>Nama</th>
<th>Email</th>
<th>No HP</th>
<th>Menu</th>
<th>Jumlah</th>
<th>Total</th>
<th>Status</th>
<th>Countdown</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

</div>

<!-- MODAL -->
<div class="modal fade"
id="modalSukses">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Pesanan Berhasil
</h5>

</div>

<div class="modal-body">

Data pesanan berhasil ditambahkan

</div>

</div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

let dataPesanan =
JSON.parse(localStorage.getItem("pesanan")) || [];

function hitungTotal(){

let menu =
$("#menuMakananSelect").val();

let jumlah =
parseInt($("#jumlah").val()) || 0;

let harga = 0;

if(menu == "Sushi"){
harga = 25000;
}

if(menu == "Ramen"){
harga = 40000;
}

if(menu == "Kebab"){
harga = 15000;
}

let total =
harga * jumlah;

$("#total").val("Rp " + total);

}

$("#menuMakananSelect, #jumlah").on("change keyup",function(){

hitungTotal();

});

function tampilData(filter=""){

let isi = "";

let antrian = 0;

dataPesanan.forEach((item,index)=>{

if(item.nama.toLowerCase().includes(filter.toLowerCase())){

if(item.status == "Diproses"){
antrian++;
}

let waktu =
parseInt(item.waktu) || 0;

let menit =
Math.floor(waktu / 60);

let detik =
waktu % 60;

isi += `
<tr>

<td>${item.nama}</td>

<td>${item.email}</td>

<td>${item.nohp}</td>

<td>${item.menu}</td>

<td>${item.jumlah}</td>

<td>${item.total}</td>

<td>

${
item.status == "Diproses"
?
'<span class="badge bg-warning">Diproses</span>'
:
'<span class="badge bg-success">Selesai</span>'
}

</td>

<td>

${
waktu > 0
?
`${menit}:${detik < 10 ? "0"+detik : detik}`
:
'Selesai'
}

</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick="editPesanan(${index})">

Edit

</button>

<button
class="btn btn-danger btn-sm"
onclick="hapusPesanan(${index})">

Hapus

</button>

</td>

</tr>
`;

}

});

$("#tbody").html(isi);

$("#jumlahAntrian").text(antrian);

localStorage.setItem(
"pesanan",
JSON.stringify(dataPesanan)
);

}

$("#btnPesan").click(function(){

let nama =
$("#nama").val();

let email =
$("#email").val();

let nohp =
$("#nohp").val();

let tanggal =
$("#tanggal").val();

let menu =
$("#menuMakananSelect").val();

let jumlah =
$("#jumlah").val();

let bayar =
$("input[name=bayar]:checked").val();

let catatan =
$("#catatan").val();

let topping = [];

$(".topping:checked").each(function(){

topping.push($(this).val());

});

if(nama == ""){
alert("Nama wajib diisi");
return;
}

if(nama.length < 3){
alert("Nama minimal 3 karakter");
return;
}

if(email == ""){
alert("Email wajib diisi");
return;
}

if(email.indexOf("@") == -1){
alert("Format email salah");
return;
}

if(isNaN(nohp)){
alert("No HP harus angka");
return;
}

if(jumlah <= 0){
alert("Jumlah harus angka");
return;
}

let waktu = 0;

if(menu == "Sushi"){
waktu = 60;
}

if(menu == "Ramen"){
waktu = 120;
}

if(menu == "Kebab"){
waktu = 180;
}

let data = {

nama : nama,
email : email,
nohp : nohp,
tanggal : tanggal,
menu : menu,
jumlah : jumlah,
bayar : bayar,
topping : topping,
catatan : catatan,
total : $("#total").val(),
status : "Diproses",
waktu : waktu

};

dataPesanan.push(data);

$("#modalSukses").modal("show");

tampilData();

$("input").val("");
$("textarea").val("");
$("select").val("");

});

$("#search").keyup(function(){

let cari =
$(this).val();

tampilData(cari);

});

setInterval(function(){

dataPesanan.forEach((item)=>{

if(item.waktu > 0){

item.waktu--;

}
else{

item.status = "Selesai";

}

});

tampilData();

},1000);

function hapusPesanan(index){

dataPesanan.splice(index,1);

tampilData();

}

function hapusData(){

localStorage.removeItem("pesanan");

dataPesanan = [];

tampilData();

}

function editPesanan(index){

let item = dataPesanan[index];

$("#nama").val(item.nama);
$("#email").val(item.email);
$("#nohp").val(item.nohp);
$("#tanggal").val(item.tanggal);
$("#menuMakananSelect").val(item.menu);
$("#jumlah").val(item.jumlah);
$("#catatan").val(item.catatan);
$("#total").val(item.total);

dataPesanan.splice(index,1);

tampilData();

}

$("#darkMode").click(function(){

$("body").toggleClass("bg-dark text-white");

});

tampilData();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
