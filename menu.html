<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Menu</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#fff5f7;
    margin:0;
    font-family:Arial;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#ff4d6d;
    position:fixed;
    left:0;
    top:0;
    padding-top:20px;
}

.logo{
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.sidebar-menu{
    padding:0 15px;
}

.sidebar-menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px;
    margin-bottom:12px;
    border-radius:10px;
    transition:0.3s;
    background:#ff6b81;
    font-weight:bold;
}

.sidebar-menu a:hover{
    background:#ff8fa3;
    transform:translateX(5px);
}

.main-content{
    margin-left:270px;
    padding:40px;
}

.section-title{
    color:#ff4d6d;
    font-weight:bold;
    margin-bottom:40px;
}

.food-card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.food-card:hover{
    transform:translateY(-10px);
}

.food-card img{
    height:250px;
    object-fit:cover;
}

.btn-order{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:12px 20px;
    font-weight:bold;
    border-radius:10px;
}

.btn-order:hover{
    background:#e63956;
    color:white;
}

@media(max-width:768px){

.sidebar{
    width:100%;
    height:auto;
    position:relative;
}

.main-content{
    margin-left:0;
    padding:20px;
}

}

</style>

</head>

<body>


<div class="sidebar">

<div class="logo">
FoodieOrder
</div>

<div class="sidebar-menu">

<a href="index.html"> Dashboard</a>

<a href="menu.html"> Menu</a>

<a href="order.html"> Order</a>

<a href="data.html"> Data</a>

<a href="about.html">About</a>

</div>

</div>

<div class="main-content">

<section class="container-fluid">

<h2 class="text-center section-title">
Menu Favorit
</h2>

<div class="row g-4">

<div class="col-md-4">

<div class="card food-card">

<img src="sushi.jpg"
class="card-img-top">

<div class="card-body text-center">

<h4>Sushi</h4>

<p>Rp 25.000</p>

<button class="btn btn-order">
Pesan
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card food-card">

<img src="ramen.jpg"
class="card-img-top">

<div class="card-body text-center">

<h4>Ramen</h4>

<p>Rp 40.000</p>

<button class="btn btn-order">
Pesan
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card food-card">

<img src="kebab.jpg"
class="card-img-top">

<div class="card-body text-center">

<h4>Kebab</h4>

<p>Rp 15.000</p>

<button class="btn btn-order">
Pesan
</button>

</div>

</div>

</div>

</div>

</section>

</div>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
